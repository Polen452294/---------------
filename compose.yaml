name: telegram-booking-platform

services:
  api:
    build: .
    image: telegram-booking-platform-app:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booking:booking@postgres:5432/booking}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_PROXY_URL: ${DOCKER_TELEGRAM_PROXY_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      fastapi run src/booking_bot/main.py --host 0.0.0.0 --port 8000"

  worker:
    build: .
    image: telegram-booking-platform-app:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booking:booking@postgres:5432/booking}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_PROXY_URL: ${DOCKER_TELEGRAM_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: booking-admin run-worker --business ${WORKER_BUSINESS_SLUG:-demo}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
